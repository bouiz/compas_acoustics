# conda / mamba environment for developing compas_acoustics from this clone:
#   mamba env create -f environment.yml
#   mamba activate compas-acoustics-bouiz
#   pytest tests/test_sample_room.py
name: compas-acoustics-bouiz
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -e .[dev,hybrid]
