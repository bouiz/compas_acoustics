name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# a new push to a pull request cancels its running checks; every push to main is checked in full
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 in actions/setup-python; 24.04 has
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # 3.9 is the Python of Rhino 8
        python: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
    env:
      # the tests in parallel on the runner's cores (pytest-xdist, from requirements-dev.txt); the slow ones run once, in the slow job
      PYTEST_ADDOPTS: '-n auto -m "not slow"'
    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          management-tool: uv
          # the lab extra (trimesh, embreex, mesh2scattering) is for Python >= 3.11; on 3.9 and 3.10 it adds nothing
          extras: dev,lab
          invoke-tasks: lint test format

  slow:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: "-n auto -m slow"
    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: "3.12"
          management-tool: uv
          extras: dev,lab
          invoke-tasks: test

  grasshopper-plugin-test:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test the Grasshopper plugin
        run: dotnet test src/compas_acoustics_ghcsharp/CompasAcoustics.sln
