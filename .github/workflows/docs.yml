name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # pyFDN -> flamo -> torch; without the CPU backend uv takes the CUDA build, whose ~5 GB fills the runner's disk
  UV_TORCH_BACKEND: cpu

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          extras: docs

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          deploy: true
          extras: docs
