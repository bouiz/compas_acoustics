name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions.docs@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Binaural and Ambisonics import on Python >= 3.11 only; the action's default is 3.10
          python: "3.12"
