name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # pyFDN -> flamo -> torch; without the CPU backend uv takes the CUDA build, whose ~5 GB fills the runner's disk
  UV_TORCH_BACKEND: cpu

jobs:
  # only checks that the docs build: release.yml deploys them
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          extras: docs
