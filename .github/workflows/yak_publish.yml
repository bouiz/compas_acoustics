name: publish_yak

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Yak server to publish to (test.yak.rhino3d.com is emptied regularly)"
        required: true
        type: choice
        default: test
        options:
          - test
          - prod
      version:
        description: "Plugin version to publish (e.g. 1.2.3). Leave empty to use the version in the .csproj."
        required: false
        type: string
  # release.yml calls it after the library is on PyPI, so that Install Worker finds the version the plugin requires
  workflow_call:
    inputs:
      environment:
        description: "Yak server to publish to: test or prod"
        required: true
        type: string
      version:
        description: "Plugin version to publish. Leave empty to use the version in the .csproj."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish_yak:
    runs-on: windows-latest
    # yak-test / yak-prod: add required reviewers to yak-prod (Settings > Environments) to approve each prod publish
    environment: yak-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: compas-dev/compas-actions/setup-python@v1
        with:
          python-version: "3.12"
          management-tool: uv
          extras: dev

      # the Grasshopper plugin (net7.0) builds with the .NET 8 SDK
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Create the Rhino 8 Yak package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($Env:VERSION) { invoke yakerize --version $Env:VERSION } else { invoke yakerize }

      # before publishing, so that a failed push still leaves the package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compas_acoustics_yak
          path: dist/yak_package/*.yak
          if-no-files-found: error

      - name: Publish to the Yak ${{ inputs.environment }} server
        shell: pwsh
        env:
          YAK_TOKEN: ${{ secrets.YAK_DF_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          $file = Get-ChildItem -Path dist\yak_package\*.yak -File | Select-Object -ExpandProperty FullName
          if ($Env:ENVIRONMENT -eq "test") { invoke publish-yak --yak-file $file --test-server } else { invoke publish-yak --yak-file $file }
